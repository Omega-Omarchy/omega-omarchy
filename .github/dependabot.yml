version: 2
updates:
  # The pip fetcher reads pyproject.toml and requirements/*.txt together, so
  # repeated runtime/build/audit pins can be updated in the same pull request.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
