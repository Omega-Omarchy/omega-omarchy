name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit pinned Python dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated audit tools
        run: |
          python -m pip install -r requirements/bootstrap.txt
          python -m pip install -r requirements/audit-tool.txt
      - name: Audit runtime and release dependencies
        run: |
          mkdir -p dist/audit-local
          python -m pip_audit -r requirements/audit-targets.txt --no-deps --disable-pip \
            --format json --output dist/audit-local/runtime-audit.json
      - name: Audit the audit toolchain
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist/audit-local
          python -m pip_audit -r requirements/audit-tool.txt --no-deps --disable-pip \
            --format json --output dist/audit-local/tooling-audit.json
      - name: Retain vulnerability reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dependency-audit
          path: dist/audit-local/*.json
          if-no-files-found: error
          retention-days: 7
