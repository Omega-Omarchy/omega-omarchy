name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and deterministic gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/audit-targets.txt
            requirements/audit-tool.txt
            requirements/bootstrap.txt
            requirements/ci.txt
      - name: Create the repository Python environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --requirement requirements/bootstrap.txt
          .venv/bin/python -m pip install --no-build-isolation --requirement requirements/ci.txt
          .venv/bin/python -m pip install --no-build-isolation -e ".[audio-authoring]"
          .venv/bin/python -m pip check
          .venv/bin/python -c "import librosa, scipy, soundfile"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run repository gate
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
          SOURCE_DATE_EPOCH: "1704067200"
        run: ./scripts/omega release-check
      - name: Confirm generated art and audio are current
        # Browser bundles include current Git-derived credits and are rebuilt
        # per commit; comparing them with a bundle from the parent cannot pass.
        run: git diff --exit-code -- assets

  native-artifact:
    name: Native Linux artifact
    needs: [test, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/audit-targets.txt
            requirements/audit-tool.txt
            requirements/bootstrap.txt
            requirements/ci.txt
      - name: Create the repository Python environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --requirement requirements/bootstrap.txt
          .venv/bin/python -m pip install --no-build-isolation --requirement requirements/ci.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build clean native bundle
        run: ./scripts/omega package --require-clean --output dist/native-local
      - name: Verify extracted artifact
        run: |
          ./scripts/omega verify-package \
            dist/native-local/omega-omarchy-0.1.0-linux-x86_64.tar.gz \
            dist/native-local/omega-omarchy-0.1.0-linux-x86_64.tar.gz.sha256 \
            --require-clean
      - name: Audit pinned Python dependencies
        run: |
          mkdir -p dist/audit-local
          python -m venv "$RUNNER_TEMP/omega-audit-venv"
          "$RUNNER_TEMP/omega-audit-venv/bin/python" -m pip install \
            --requirement requirements/bootstrap.txt
          "$RUNNER_TEMP/omega-audit-venv/bin/python" -m pip install \
            --requirement requirements/audit-tool.txt
          "$RUNNER_TEMP/omega-audit-venv/bin/python" -m pip_audit \
            --requirement requirements/audit-targets.txt \
            --no-deps \
            --disable-pip \
            --format json \
            --output dist/audit-local/pip-audit.json
      - name: Build and scan release surfaces
        env:
          SOURCE_DATE_EPOCH: "1704067200"
        run: |
          ./scripts/omega web --web-out .local/release-web
          ./scripts/omega audit-release \
            --require-clean \
            --report-only \
            --build-distributions \
            --vulnerability-report dist/audit-local/pip-audit.json \
            --artifact native=dist/native-local/omega-omarchy-0.1.0-linux-x86_64.tar.gz \
            --artifact web=.local/release-web
      - name: Retain bundle and checksum
        id: retain-artifact
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omega-omarchy-native-linux-x86_64
          path: |
            dist/native-local/*.tar.gz
            dist/native-local/*.sha256
            dist/audit-local/pip-audit.json
            dist/audit-local/release-audit.json
            dist/audit-local/release-audit.md
            dist/audit-local/sbom.spdx.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Record artifact retention result
        if: always()
        env:
          RETENTION_OUTCOME: ${{ steps.retain-artifact.outcome }}
        run: |
          if [[ "$RETENTION_OUTCOME" == "failure" ]]; then
            echo "::warning title=Artifact retention unavailable::" \
              "Artifact upload failed; check the upload log and account storage quota."
            {
              echo "### Artifact retention unavailable"
              echo "Artifact upload failed. Check the preceding build and verification results."
              echo "Check the account-wide Actions storage quota."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RETENTION_OUTCOME" != "success" ]]; then
            echo "Artifact upload was not attempted; inspect the preceding job steps." >> "$GITHUB_STEP_SUMMARY"
          fi

  website:
    name: Website and editor checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install build tools
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -r requirements/bootstrap.txt
          .venv/bin/python -m pip install --no-build-isolation -r requirements/ci.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check browser JavaScript and shell syntax
        run: |
          for script in website/*.js website/*.mjs; do node --check "$script"; done
          bash -n scripts/omega
      - name: Test website motion, news, and editor state
        run: |
          node --test website/motion.test.mjs website/news.test.mjs tests/level_editor_state.test.cjs
          python -m unittest discover -s website -p 'test_*.py'
      - name: Build and validate the public website
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SOURCE_DATE_EPOCH: "1704067200"
        run: |
          ./scripts/omega website --out .local/website-check
          python website/check.py --directory .local/website-check
