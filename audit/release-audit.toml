schema_version = 1

# Every exception is category-, scope-, locator-, and fingerprint-bound where
# practical. Matched values never appear here; the audit report supplies only
# stable one-way fingerprints.

[[allow]]
id = "tracked-env-template"
category = "sensitive-file-name"
scope = "*"
locator = "*.env.example"
fingerprint = "d36f3ab155cf1c7d0aa1"
rationale = "Tracked comment-only template contains no assignments or credentials."

