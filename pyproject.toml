[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-omarchy"
version = "0.1.0"
description = "Omega Omarchy — a fast, customizable, retro-inspired game about user-owned computing."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Omega Omarchy contributors"}]
keywords = [
  "game",
  "pygame",
  "platformer",
  "action-game",
  "retro-game",
  "pixel-art",
  "indie-game",
  "linux",
  "arch-linux",
  "omarchy",
  "webassembly",
  "browser-game",
]
dependencies = [
  "pygame-ce==2.5.8",
  "pillow==12.3.0",
  "qrcode==8.2",
  "numpy==2.4.6",
]

[project.optional-dependencies]
audio-authoring = [
  "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.15",
  "scipy>=1.14,<2",
]
dev = [
  "pytest==9.1.1",
]
release = [
  "pyinstaller==6.22.2",
]
web = [
  "pygbag==0.9.3",
]
limitless = [
  "limitless-library>=0.1.0a0",
]

[project.scripts]
omega-omarchy = "omega_omarchy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omega_omarchy = [
  "data/**/*.json",
  "data/**/*.md",
  "data/**/*.toml",
  "data/**/*.txt",
  "data/**/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.omega-omarchy]
generator_version = "3.10.0"
schema_version = "1.0.0"
fixture_seed = "omega-fixture-1"
internal_width = 320
internal_height = 180
tick_hz = 60
